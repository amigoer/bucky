version: '3'

vars:
  BIN_DIR: bin
  GOOS: '{{.GOOS | default OS}}'

tasks:
  dev:
    desc: Run the desktop app with Go reload
    cmds:
      - go tool mygo dev
  run:
    desc: Run the desktop app once
    cmds:
      - go run ./cmd/bucky-desktop
  build:
    desc: Build the CLI and the desktop application
    cmds:
      - task: build:cli
      - task: build:desktop
  build:cli:
    desc: Build the CLI without CGO
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -buildvcs=false -o bin/bucky{{exeExt}} ./cmd/bucky
  build:desktop:
    desc: Package the native desktop application
    cmds:
      - go tool mygo build
  lint:
    desc: Check Go sources
    cmds:
      - golangci-lint run ./cmd/... ./internal/...
  format:
    desc: Format Go sources
    cmds:
      - go fmt ./cmd/... ./internal/...
  test:
    desc: Run unit tests without cloud credentials
    cmds:
      - go test -race ./internal/... ./cmd/...
  test:integration:
    desc: Run MinIO and RustFS protocol contracts in disposable containers
    cmds:
      - go test -tags integration -count=1 -timeout 10m ./test/integration
  check:
    desc: Run lint, unit tests and local builds
    cmds:
      - task: lint
      - task: test
      - task: build

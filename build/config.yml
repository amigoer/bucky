version: '3'
info:
  companyName: Amigoer
  productName: Bucky
  productIdentifier: io.amigoer.bucky
  description: Cloudflare R2 object storage client
  copyright: Copyright 2026 Amigoer
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, build, test]
    file: [.DS_Store, .gitignore, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: task build:desktop DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: task run
      type: primary
      exit_policy: shutdown

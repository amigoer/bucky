version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:build:frontend
    env:
      CGO_ENABLED: '1'
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
    cmds:
      - go build {{if ne .DEV "true"}}-tags production -trimpath{{end}} -buildvcs=false -o bin/bucky-desktop ./cmd/bucky-desktop
  package:
    deps:
      - task: build
    cmds:
      - mkdir -p bin/Bucky.app/Contents/MacOS bin/Bucky.app/Contents/Resources
      - cp bin/bucky-desktop bin/Bucky.app/Contents/MacOS/bucky-desktop
      - cp build/darwin/Info.plist bin/Bucky.app/Contents/Info.plist
      - cp build/darwin/icons.icns bin/Bucky.app/Contents/Resources/icons.icns
      - codesign --force --deep --sign - bin/Bucky.app
      - codesign --verify --deep --strict bin/Bucky.app
  run:
    cmds:
      - mkdir -p bin/Bucky.dev.app/Contents/MacOS bin/Bucky.dev.app/Contents/Resources
      - cp bin/bucky-desktop bin/Bucky.dev.app/Contents/MacOS/bucky-desktop
      - cp build/darwin/Info.dev.plist bin/Bucky.dev.app/Contents/Info.plist
      - cp build/darwin/icons.icns bin/Bucky.dev.app/Contents/Resources/icons.icns
      - codesign --force --deep --sign - bin/Bucky.dev.app
      - bin/Bucky.dev.app/Contents/MacOS/bucky-desktop
